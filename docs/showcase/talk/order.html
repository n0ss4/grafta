<!doctype html><html data-theme="dark"><meta charset="utf-8"><style>
:root{--background:#F6F4EE;--surface:#FFFFFF;--ink:#15171C;--muted:#6B6F76;--border:#E6E2D8;--accent:#13704B;--accent-soft:#E3F4EA;--on-accent:#FFFFFF;--track:#ECE8DE}
[data-theme=dark]{--background:#0D1117;--surface:#161B22;--ink:#F6F4EE;--muted:#9DA3AB;--border:#30363D;--accent:#C6F26B;--accent-soft:#1C2B23;--on-accent:#15171C;--track:#21262D}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,sans-serif;background:transparent}
.order{width:360px;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--background)}
h1{font-size:28px;line-height:28px;font-weight:700;color:var(--ink)}
.placed{font-size:14px;line-height:14px;color:var(--muted)}
.card{align-self:stretch;padding:20px;display:flex;flex-direction:column;gap:14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px rgba(21,23,28,.06)}
.header{display:flex;align-items:center;gap:14px}
.icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.labels{display:flex;flex-direction:column;gap:2px}
.labels b{font-size:17px;line-height:17px;color:var(--ink)}
.labels span{font-size:14px;line-height:14px;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.done{width:196px;height:8px;border-radius:4px;background:var(--accent)}
.steps{display:flex;justify-content:space-between;font-size:12px;line-height:12px;font-weight:500;color:var(--muted)}
.steps b{font-weight:700;color:var(--accent)}
.button{align-self:stretch;padding:16px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:15px;font-weight:700}
.note{font-size:13px;line-height:13px;color:var(--muted)}
svg{display:block;fill:none;stroke-linecap:round;stroke-linejoin:round}
