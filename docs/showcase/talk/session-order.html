<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Theme tokens, from the file's "Theme" variable collection. Light is the default. */
    :root {
      --background: #F6F4EE;
      --surface: #FFFFFF;
      --ink: #15171C;
      --muted: #6B6F76;
      --border: #E6E2D8;
      --accent: #13704B;
      --accent-soft: #E3F4EA;
      --on-accent: #FFFFFF;
      --track: #ECE8DE;
    }
    [data-theme="dark"] {
      --background: #0D1117;
      --surface: #161B22;
      --ink: #F6F4EE;
      --muted: #9DA3AB;
      --border: #30363D;
      --accent: #C6F26B;
      --accent-soft: #1C2B23;
      --on-accent: #15171C;
      --track: #21262D;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background); }

    .order {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px;
      background: var(--background);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1;
    }
    .order h1, .order h2, .order p, .order ol { margin: 0; padding: 0; }

    .order__title { font-size: 28px; font-weight: 700; }
    .order__meta,
    .order__note { color: var(--muted); }
    .order__meta { font-size: 14px; }
    .order__note { font-size: 13px; }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgb(21 23 28 / 0.06);
    }

    .card__header { display: flex; align-items: center; gap: 14px; }
    .card__icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .card__labels { display: flex; flex-direction: column; gap: 2px; }
    .card__number { font-size: 17px; font-weight: 700; }
    .card__eta { font-size: 14px; color: var(--muted); }

    .progress {
      height: 8px;
      border-radius: 4px;
      background: var(--track);
      overflow: hidden;
    }
    .progress__done {
      height: 100%;
      width: var(--progress, 72%);
      border-radius: 4px;
      background: var(--accent);
    }

    .steps {
      display: flex;
      justify-content: space-between;
      list-style: none;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .steps [aria-current="step"] { font-weight: 700; color: var(--accent); }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .icon {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main class="order">
    <h1 class="order__title">Your order</h1>
    <p class="order__meta">Placed 2 Oct · 3 items</p>

    <section class="card" aria-labelledby="order-number">
      <div class="card__header">
        <div class="card__icon" aria-hidden="true">
          <svg class="icon" width="22" height="22" viewBox="0 0 22 22" stroke-width="2">
            <path d="M10.083 19.919a1.833 1.833 0 0 0 1.834 0l6.416-3.667a1.833 1.833 0 0 0 .917-1.585V7.333a1.833 1.833 0 0 0-.917-1.585L11.917 2.08a1.833 1.833 0 0 0-1.834 0L3.667 5.748a1.833 1.833 0 0 0-.917 1.585v7.334a1.833 1.833 0 0 0 .917 1.585zM11 20.167V11M3.025 6.417l7.061 4.339a1.833 1.833 0 0 0 1.828 0l7.061-4.339M6.875 3.914l8.25 4.721"/>
          </svg>
        </div>
        <div class="card__labels">
          <h2 class="card__number" id="order-number">Order #4821</h2>
          <p class="card__eta">Arriving tomorrow, 9–12</p>
        </div>
      </div>

      <div class="progress" role="progressbar" aria-label="Delivery progress"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="72"
           aria-valuetext="Out for delivery">
        <div class="progress__done" style="--progress: 72%"></div>
      </div>

      <ol class="steps">
        <li>Packed</li>
        <li>Shipped</li>
        <li aria-current="step">Out for delivery</li>
      </ol>
    </section>

    <button class="button" type="button">
      Track order
      <svg class="icon" width="18" height="18" viewBox="0 0 18 18" stroke-width="2.4" aria-hidden="true">
        <path d="M3.75 9h10.5M9 3.75 14.25 9 9 14.25"/>
      </svg>
    </button>

    <p class="order__note">Delivered to the door · no signature</p>
  </main>
</body>
</html>
