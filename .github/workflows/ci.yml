# The quality gate: clippy and the suite,
# on a clone with no fixtures, on every platform a release ships for.
name: ci

# main moves only by pull requests checked here, so it is not run again there.
# develop is the default branch: its runs save the caches pull requests read.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; on develop each commit
# runs, as the group names it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs a change needs, from the paths it touches, as Ruff decides it:
  # `git diff --quiet` per job. The jobs everything feeds are written by
  # exclusion, so a file nobody listed runs them; the site, fed by a few
  # paths, by inclusion. A change to this file, a manual run, or a push that
  # cannot be compared runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.diff.outputs.test }}
      packaging: ${{ steps.diff.outputs.packaging }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          everything() {
            echo "$1, so every job runs"
            printf 'test=true\npackaging=true\nweb=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || everything "a manual run"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || everything "nothing to compare with"
          git diff --name-only "$BASE...HEAD"
          git diff --quiet "$BASE...HEAD" -- .github/workflows/ci.yml || everything "CI itself changed"

          # true when the change touches a path the pathspecs select.
          touches() { git diff --quiet "$BASE...HEAD" -- "$@" && echo false || echo true; }

          # Prose, read by no job.
          set -- ':!*.md' ':!LICENSE' ':!docs' ':!.gitignore' ':!.github/ISSUE_TEMPLATE' \
            ':!.github/dependabot.yml' ':!.github/workflows/conventions.yml'

          # The workspace's tests: all but prose, the site and what packages the binary.
          test="$(touches "$@" ':!web' ':!npm' ':!plugin' ':!.claude-plugin' ':!.agents' ':!packaging' \
            ':!server.json' ':!install.sh' ':!install.ps1' ':!scripts' ':!release-please-config.json' \
            ':!.release-please-manifest.json' ':!.github')"

          # The binary, the channels and the public figures: all but prose and the
          # site, and the prose and site files its checks read.
          packaging="$(touches "$@" ':!web' ':!.github/workflows/pages.yml')"
          [ "$packaging" = true ] || packaging="$(touches README.md npm/grafta/README.md docs/TOOLS.md \
            web/src/content web/src/components web/src/routes web/src/generated)"

          # The site, its changelog page, the pictures and brand it copies, the scripts it serves.
          web="$(touches web CHANGELOG.md docs/assets docs/brand install.sh install.ps1 \
            'scripts/snapshot.*' .github/workflows/pages.yml)"

          printf 'test=%s\npackaging=%s\nweb=%s\n' "$test" "$packaging" "$web" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # Saved on develop alone, whose caches every pull request can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The text tests draw in Inter; a runner image's own fonts change
      # under us, so the font they name is installed, not left to chance.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: node --check npm/grafta/bin/grafta.js
      - run: scripts/set-version.sh --check
      # The Claude Desktop bundle's manifest, validated with the Linux binary
      # standing in for the macOS and Windows ones.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Saved on develop alone, whose caches every pull request can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo build --release --locked -p grafta
      - run: python3 scripts/mcpb.py target/release/grafta target/release/grafta grafta.mcpb
      # docs/TOOLS.md and the website's web/src/generated/tools.json are the server's own tool list.
      - run: python3 scripts/tool-reference.py target/release/grafta --check
      - run: python3 scripts/check-public-figures.py

  # The website: types, lint, tests, the pre-rendered build, and the
  # browser's view of it (routes, keyboard, scripts off, axe, Lighthouse).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lighthouse

  # The one check a branch requires. A job skipped reports under its own name
  # only sometimes, as a matrix does not, so requiring those would wait forever.
  ci:
    if: always()
    needs: [changes, test, packaging, web]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
