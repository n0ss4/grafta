# The quality gate: clippy and the suite,
# on a clone with no fixtures, on every platform a release ships for.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each job runs when the change touches what it checks, as
  # scripts/ci-changes.sh names by file: prose runs nothing, the site alone
  # runs only web, and a file it does not name runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      packaging: ${{ steps.diff.outputs.packaging }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # What cannot be compared, a new branch's first push, gives no files,
          # and the script runs everything for that.
          files="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The text tests draw in Inter; a runner image's own fonts change
      # under us, so the font they name is installed, not left to chance.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: node --check npm/grafta/bin/grafta.js
      - run: scripts/set-version.sh --check
      # The Claude Desktop bundle's manifest, validated with the Linux binary
      # standing in for the macOS and Windows ones.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p grafta
      - run: python3 scripts/mcpb.py target/release/grafta target/release/grafta grafta.mcpb
      # docs/TOOLS.md and the website's web/src/generated/tools.json are the server's own tool list.
      - run: python3 scripts/tool-reference.py target/release/grafta --check
      - run: python3 scripts/check-public-figures.py

  # The website: types, lint, tests, the pre-rendered build, and the
  # browser's view of it (routes, keyboard, scripts off, axe, Lighthouse).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lighthouse

  # The one check a branch requires. A job skipped reports under its own name
  # only sometimes, as a matrix does not, so requiring those would wait forever.
  ci:
    if: always()
    needs: [changes, test, packaging, web]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
