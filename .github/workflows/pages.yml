# The website: web/, built and pre-rendered, with the README's pictures
# and the install scripts beside it, on GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths: [web/**, docs/assets/**, docs/brand/**, CHANGELOG.md, install.sh, install.ps1, scripts/snapshot.*, .github/workflows/pages.yml, crates/**, Cargo.toml, Cargo.lock, scripts/web-reader.sh, scripts/install-binaryen.sh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The browser reader, into web/public/reader/ before the site is built.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: |
          scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - run: |
          pinned=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' Cargo.toml)
          wasm-bindgen --version 2>/dev/null | grep -q " $pinned$" || cargo install wasm-bindgen-cli --version "$pinned" --locked
      - run: scripts/web-reader.sh
      # npm run build copies the pictures, brand and install scripts into the
      # site (web/scripts/sync-public.mjs) and lays it out as Pages serves it
      # (web/scripts/pages-layout.mjs).
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build/client
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
