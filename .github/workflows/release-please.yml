# The next version, from the commits: a pull request into main that says what
# would be released, and, once it is merged, the tag that starts release.yml.
#
# RELEASE_TOKEN is a fine-grained token of a repository admin, with Contents and
# Pull requests read and write. Only admins can create release tags, and what the
# default token does starts no other workflow: neither CI on the pull request nor
# release.yml on the tag.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.prs_created }}
      branch: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # release-please knows the manifest and the changelog. Every other file that
  # names the version is scripts/set-version.sh's, the same script release.yml checks.
  versions:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Every channel names the next version
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          scripts/set-version.sh "$version"
          cargo update -w
          scripts/set-version.sh --check "$version"
          git config user.name "grafta release"
          git config user.email "release@grafta.invalid"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: name ${version} in every channel" && git push; }

  # What a release pull request wrote to main goes back, so develop does not
  # drift from it. A conflict fails here, to be merged by hand.
  develop:
    needs: release-please
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Merge main into develop
        run: |
          git config user.name "grafta release"
          git config user.email "release@grafta.invalid"
          git merge --no-edit -m "chore: merge main into develop" "origin/main"
          git push origin develop
