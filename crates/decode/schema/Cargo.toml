[package]
name = "grafta-schema"
description = "The .fig format's field names, enum values and ids, each named once, and typed access to a decoded message."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../../README.md"

[lib]
name = "schema"

[dependencies]
kiwi.workspace = true

serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A path alone: `figfile` needs this crate first, so crates.io cannot hold a
# version of it yet when this crate is published.
figfile = { package = "grafta-figfile", path = "../figfile" }
